[project]
name = "k8s-python-pg"
version = "0.0.0"
description = "FastAPI app that uses Postgres. All inside k8s."
requires-python = ">=3.12, <4"
dependencies = [
    "fastapi[standard] (>=0.135.3, <0.136)",
    "psycopg[binary] (>=3.3.3, <4)",
    "sqlalchemy (>=2.0.48, <3)",
    "alembic (>=1.18.4, <2)",
    "pydantic-settings (>=2.13.1, <3)",
]
